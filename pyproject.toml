[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "asset_articulator"
version = "0.1.0"
description = "Interactive tool for annotating articulated joints on 3-D mesh assets and exporting URDF."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "trimesh",
  "pyvista",
  "vtk",
  "open3d",
  "networkx",
  "matplotlib",
  "PyQt5",
  "pyvistaqt",
]

[project.optional-dependencies]
develop = [
    "black",
    "docformatter",
    "isort",
    "mypy",
    "pylint>=2.14.5",
    "pytest-pylint>=0.18.0",
    "pytest>=7.2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asset_articulator = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
py_version = 310
profile = "black"
multi_line_output = 2
skip_glob = ["venv/*", ".venv/*"]
split_on_trailing_comma = true

[tool.docformatter]
line-length = 88
wrap-summaries = 88
wrap-descriptions = 88

[tool.mypy]
strict_equality = true
disallow_untyped_calls = true
warn_unreachable = true
exclude = ["venv/*", ".venv/*", "scripts/.*"]

[[tool.mypy.overrides]]
module = [
    "matplotlib.*",
    "PyQt5.*",
    "pyvistaqt.*",
    "open3d.*",
    "trimesh.*",
    "pyvista.*",
    "networkx.*",
]
ignore_missing_imports = true
